name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, matching manifest.json
        required: true
      upload_only:
        description: Upload without submitting for review
        type: boolean
        default: false
      stores:
        description: Which stores to publish to
        type: choice
        default: both
        options:
          - both
          - chrome
          - firefox
  release:
    types:
      - published

jobs:
  chrome:
    if: inputs.stores != 'firefox'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release archives
        run: scripts/package-release.sh "${{ steps.version.outputs.version }}"

      - name: Publish to the Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          if [ "${{ inputs.upload_only }}" = "true" ]; then
            scripts/publish-chrome.sh "${{ steps.version.outputs.version }}" --upload-only
          else
            scripts/publish-chrome.sh "${{ steps.version.outputs.version }}"
          fi

  firefox:
    if: inputs.stores != 'chrome'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release archives
        run: scripts/package-release.sh "${{ steps.version.outputs.version }}"

      - name: Publish to Firefox Add-ons
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_ADDON_GUID: ${{ vars.AMO_ADDON_GUID }}
        run: |
          if [ "${{ inputs.upload_only }}" = "true" ]; then
            scripts/publish-firefox.sh "${{ steps.version.outputs.version }}" --upload-only
          else
            scripts/publish-firefox.sh "${{ steps.version.outputs.version }}"
          fi
